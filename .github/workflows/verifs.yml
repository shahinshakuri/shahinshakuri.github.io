# Vérifications sur chaque pull request (ne publie rien).
# Contrôles : types, tests, construction, orthographe, liens, accessibilité (axe), Lighthouse.
name: Vérifications

on:
  pull_request:

permissions:
  contents: read

env:
  ASTRO_TELEMETRY_DISABLED: 1

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7
      - name: Installer Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Installer les dépendances
        run: npm ci
      - name: Vérifier les types (astro check)
        run: npm run check
      - name: Lancer les tests (Vitest)
        run: npm test
      - name: Construire le site
        run: npm run build
      - name: Vérifier l'orthographe (cspell)
        run: npm run orthographe
      - name: Chercher les liens cassés dans le site (linkinator)
        run: npm run liens
      - name: Installer le navigateur des tests (Chromium)
        run: npx playwright install --with-deps chromium
      - name: Tester dans le navigateur (accessibilité, mobile, clavier, sans JavaScript)
        run: npm run test:e2e
      - name: Mesurer avec Lighthouse en mode sobre (note minimale 90)
        run: npm run lighthouse
