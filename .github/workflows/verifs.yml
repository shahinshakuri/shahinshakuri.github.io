# Vérifications sur chaque pull request (ne publie rien).
# Phase 4 : ajout de la recherche de liens cassés et du contrôle d'accessibilité.
name: Vérifications

on:
  pull_request:

permissions:
  contents: read

env:
  ASTRO_TELEMETRY_DISABLED: 1

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7
      - name: Installer Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Installer les dépendances
        run: npm ci
      - name: Vérifier les types (astro check)
        run: npm run check
      - name: Lancer les tests (Vitest)
        run: npm test
      - name: Construire le site
        run: npm run build
