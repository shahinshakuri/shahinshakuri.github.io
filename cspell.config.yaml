# Orthographe des textes du site : `npm run orthographe`.
# Mots inconnus du dictionnaire mais corrects (noms propres, mots techniques) : liste `words` ci-dessous.
version: '0.2'
language: fr,en
import:
  - '@cspell/dict-fr-fr/cspell-ext.json'
files:
  - 'src/**/*.{astro,ts}'
  - 'README.md'
  - 'DECISIONS.md'
ignorePaths:
  - 'src/**/*.test.ts'
  - 'tests/**'
# Ne vérifier que le texte, pas les adresses, couleurs ou noms de classes CSS.
ignoreRegExpList:
  - '/https?:\/\/\S+/g'
  - '/#[0-9a-fA-F]{3,8}\b/g'
  - '/[\w.-]+@[\w.-]+/g'
# Noms propres, termes techniques et noms de variables écrits sans accents dans le code.
